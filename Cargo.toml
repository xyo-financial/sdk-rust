workspace = { members = ["openapi"], exclude = ["example"] }

[package]
name = "xyo-sdk"
description = "XYO Financial Official SDK for Rust"
version = "2.0.0"
edition = "2021"
authors = [
    "Hadi Tajallaei <hadi@syniol.com>"
]
repository = "https://github.com/xyo-financial/sdk-rust"
homepage = "https://xyo.financial"
categories = ["finance"]
license = "Apache-2.0"
readme = "README.md"
exclude = [
    ".idea",
    ".gitignore",
    ".github",
    "Dockerfile",
    "LICENSE",
    "Makefile",
    "example/*",
    "docs/*"
]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
xyo-openapi-client = { version = "2.0.0", path = "openapi" }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
flate2 = "1.0"
tar = "0.4"
url = "2.5"
tracing = "0.1"
httpdate = "1.0"

[dev-dependencies]
wiremock = "0.6"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }


